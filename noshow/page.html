<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No-Show Desk</title>
<link rel="preload" href="/fonts/overpass-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Overpass"; src: url("/fonts/overpass-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    --panel: #F4F5F2; --row: #FFFFFF; --ink: #15191C; --muted: #5E676C; --rule: #DADEDB; --rule-strong: #C3C9C6;
    --lamp: #F2B705; --lamp-ink: #15191C; --lamp-soft: #FCF1CC; --ok: #1F7A5A; --warn: #9A3B12;
    --ink-btn: #15191C; --ink-btn-text: #FFFFFF; --focus: #15191C;
    --board: #15191C; --board-cell: #262C30; --board-ink: #F4F5F2; --board-dim: #6F797D;
    --s1: 15px; --s2: 30px;
    --face: "Overpass", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: #121517; --row: #1A1E21; --ink: #ECEFEC; --muted: #9BA4A8; --rule: #2A3034; --rule-strong: #3A4247;
      --lamp-soft: #3A3115; --ok: #5CC197; --warn: #F0A27E;
      --ink-btn: #ECEFEC; --ink-btn-text: #121517; --focus: #ECEFEC; color-scheme: dark;
      --board: #0A0C0D; --board-cell: #1E2427; --board-dim: #5F696D;
    }
  }
  :root[data-theme="dark"] {
    --panel: #121517; --row: #1A1E21; --ink: #ECEFEC; --muted: #9BA4A8; --rule: #2A3034; --rule-strong: #3A4247;
    --lamp-soft: #3A3115; --ok: #5CC197; --warn: #F0A27E;
    --ink-btn: #ECEFEC; --ink-btn-text: #121517; --focus: #ECEFEC; color-scheme: dark;
    --board: #0A0C0D; --board-cell: #1E2427; --board-dim: #5F696D;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--panel); color: var(--ink); font: 400 var(--s1)/1.5 var(--face);
         font-variant-numeric: tabular-nums; caret-color: var(--ink); }
  ::selection { background: var(--lamp); color: var(--lamp-ink); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  svg { flex: none; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

  /* top line */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 0; color: var(--muted); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 800; letter-spacing: .01em; }
  .brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--lamp); }
  .demo { padding: 1px 8px; border: 1px solid var(--rule-strong); border-radius: 99px; white-space: nowrap; }

  /* headline */
  .lede { padding: 36px 0 20px; }
  h1 { margin: 0; font-size: var(--s2); line-height: 1.12; font-weight: 800; letter-spacing: -0.015em; text-wrap: balance; }
  .lede p { margin: 10px 0 0; color: var(--muted); max-width: 60ch; }
  .lede p b { color: var(--ink); font-weight: 600; }
  .proof { margin-top: 14px; }
  .proof summary, .more summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; }
  .proof summary { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 4px; }
  .proof summary::-webkit-details-marker, .more summary::-webkit-details-marker { display: none; }
  .proof[open] > summary svg, .more[open] > summary svg { transform: rotate(180deg); }
  .proof div { margin-top: 10px; max-width: 62ch; color: var(--muted); }
  .proof div p { margin: 0 0 8px; }

  /* switch */
  .switch { display: flex; border-bottom: 1px solid var(--rule-strong); }
  .switch button { border: 0; background: none; padding: 10px 2px; margin: 0 20px -1px 0; color: var(--muted); font-weight: 600;
                   border-bottom: 2px solid transparent; }
  .switch button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .switch .n { margin-left: 6px; font-weight: 400; color: var(--muted); }

  /* the board */
  .board { list-style: none; margin: 0; padding: 0; }
  .r { border-bottom: 1px solid var(--rule); }
  .head { width: 100%; display: grid; grid-template-columns: 60px minmax(0, 1fr) auto 18px; align-items: center; gap: 14px;
          padding: 14px 4px; border: 0; background: none; text-align: left; }
  .head:hover { background: color-mix(in srgb, var(--row) 70%, transparent); }
  .lamp { display: inline-grid; place-items: center; height: 30px; border-radius: 6px; font-weight: 800;
          border: 1px solid var(--rule-strong); color: var(--muted); }
  .lit .lamp { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink);
               box-shadow: 0 1px 2px rgba(0,0,0,.12); transition: background-color .4s var(--ease), color .4s var(--ease); }
  .done .lamp { border-style: dashed; }
  .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who > span { color: var(--muted); }
  .r em { font-style: normal; font-weight: 400; color: var(--muted); }
  .r em { white-space: nowrap; }
  .r em.st-ready { font-weight: 600; color: var(--ink); }
  .r em.st-sent { font-weight: 600; color: var(--ok); }
  .done .who b { color: var(--muted); }
  .amt { text-align: right; font-weight: 600; }
  .col { display: none; color: var(--ink); }
  .col span { display: block; color: var(--muted); }
  .sep { display: inline-block; width: 3px; height: 3px; margin: 0 7px; border-radius: 50%; background: currentColor; vertical-align: middle; opacity: .7; }
  .cols { display: none; }
  .chev { color: var(--muted); display: grid; transition: transform .26s var(--ease); }
  .r.open .chev { transform: rotate(180deg); }

  /* the pass that unfolds from a row */
  .fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s var(--ease); }
  .r.open .fold { grid-template-rows: 1fr; }
  .fold > div { overflow: hidden; min-height: 0; }
  .pass { margin: 0 4px 18px; background: var(--row); border: 1px solid var(--rule); border-radius: 10px;
          box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 24px -16px rgba(0,0,0,.3); }
  .cells { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0; border-bottom: 1px solid var(--rule); }
  .cells div { padding: 12px 14px; }
  .cells div + div { border-left: 1px solid var(--rule); }
  .cells dt { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
  .cells dd { margin: 0; font-weight: 600; }
  .sec { padding: 14px; border-bottom: 1px solid var(--rule); }
  .sec:last-child { border-bottom: 0; }
  .sec h3 { margin: 0 0 4px; font-size: var(--s1); font-weight: 800; }
  .sec p { margin: 0; max-width: 65ch; }
  .why b { font-weight: 600; }
  .more { margin-top: 8px; }
  .more summary { color: var(--muted); }
  .more ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
  .more li + li { margin-top: 4px; }
  .common { margin: 14px 4px 4px; color: var(--muted); max-width: 70ch; }
  .common b { color: var(--ink); font-weight: 600; }
  .daybreak { padding: 18px 4px 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 12px;
              border-bottom: 1px solid var(--rule-strong); }
  .note { color: var(--muted); }
  .hint { margin-top: 10px !important; }

  .act { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px; font-weight: 600;
         border: 1px solid var(--ink-btn); background: var(--ink-btn); color: var(--ink-btn-text);
         transition: transform .12s var(--ease), box-shadow .2s var(--ease); }
  .btn:hover { box-shadow: 0 2px 4px rgba(0,0,0,.12), 0 8px 18px -10px rgba(0,0,0,.4); }
  .btn:active { transform: translateY(1px); }
  .btn.quiet { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
  .btn.quiet:hover { box-shadow: none; border-color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: progress; box-shadow: none; }
  textarea { width: 100%; min-height: 128px; padding: 12px; resize: vertical; border: 1px solid var(--rule-strong); border-radius: 8px;
             background: var(--panel); line-height: 1.55; margin: 6px 0 10px; }
  .verdict { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 12px !important; }
  .verdict.ok { color: var(--ok); }
  .verdict.warn { color: var(--warn); }
  .bar { height: 3px; border-radius: 2px; background: var(--rule); overflow: hidden; margin: 6px 0 10px; }
  .bar i { display: block; height: 100%; width: 4%; background: var(--ink); animation: grow 34s var(--ease) forwards; }
  .bar.quick i { animation-duration: 5s; }
  @keyframes grow { to { width: 94%; } }
  .sent { display: flex; gap: 8px; align-items: flex-start; color: var(--ok); font-weight: 600; }
  .sent .tag { display: inline-block; margin-top: 4px; }
  .tag { font-weight: 400; color: var(--muted); border: 1px dashed var(--rule-strong); border-radius: 99px; padding: 0 8px; }
  blockquote { margin: 10px 0 0; padding: 10px 12px; background: var(--panel); border-radius: 8px; color: var(--muted); }
  .err { color: var(--warn); margin-top: 8px !important; }

  /* bookings tools */
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
  .find { position: relative; flex: 1 1 220px; max-width: 320px; }
  .find svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; color: var(--muted); }
  .find input { width: 100%; height: 40px; padding: 0 12px 0 34px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--row); }
  .find input::placeholder { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--rule-strong); background: transparent; color: var(--muted); }
  .chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  .pager { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; color: var(--muted); }
  .pager div { display: flex; gap: 8px; }
  .pager button, .step button { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--rule-strong); border-radius: 8px; background: transparent; }
  .pager button:disabled, .step button:disabled { opacity: .35; cursor: default; }

  /* replay: a past morning, then what really happened */
  .rp .head { cursor: default; }
  .rp .head:hover { background: none; }
  .flip { display: inline-block; }
  .reveal .flip { animation: flap .45s var(--ease) both; animation-delay: var(--d, 0ms); }
  @keyframes flap { from { transform: perspective(240px) rotateX(-90deg); opacity: 0; } }
  .r em.st-caught { font-weight: 600; color: var(--ink); }
  .r em.st-missed { font-weight: 600; color: var(--warn); }
  .step { display: flex; align-items: center; gap: 8px; }
  .step span { min-width: 9.5em; text-align: center; font-weight: 600; line-height: 1.25; }
  .step small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); }
  .line output { color: var(--ink); font-weight: 800; min-width: 3ch; }
  .line input { accent-color: var(--ink); width: 150px; }
  .line .rest { margin: 0; }
  .act.rp-act { padding: 4px 0 14px; }
  .sum { padding: 4px 0 14px; }
  .sum .big { margin: 0; color: var(--ink); font-size: var(--s2); font-weight: 800; line-height: 1.15; letter-spacing: -0.015em; }
  .sum p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
  .sum p b { color: var(--ink); font-weight: 600; }
  .strip { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; align-items: end; height: 84px; margin: 14px 0 6px; }
  .strip button { height: 100%; display: flex; flex-direction: column-reverse; gap: 2px; padding: 0 0 6px; border: 0; border-radius: 0; background: none; }
  .strip button.here { background: linear-gradient(var(--ink), var(--ink)) bottom / 100% 2px no-repeat; }
  .strip i, .key i { display: block; border-radius: 2px; }
  .strip i { transition: height .5s var(--ease); }
  .strip.intro i { transition-delay: var(--d); }
  .strip .c { height: calc(var(--c) * 72px); }
  .strip .m { height: calc(var(--m) * 72px); }
  .c { background: var(--ink); }
  .m { box-shadow: inset 0 0 0 1px var(--rule-strong); }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin: 0; color: var(--muted); font-size: 13px; }
  .key i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }

  /* Gemma in the browser: one honest screen, every step driven by a real event */
  .top-r { display: flex; gap: 8px; align-items: center; }
  .gem-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px;
              border: 1px solid var(--rule-strong); background: none; color: var(--muted); white-space: nowrap; }
  .gem-chip em { font-style: normal; }
  .gem-chip i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
  .gem-chip.on { color: var(--ink); }
  .gem-chip.on i { background: var(--ok); border-color: var(--ok); }
  dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--rule);
           border-radius: 12px; background: var(--row); color: var(--ink); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); }
  dialog::backdrop { background: rgba(10, 12, 13, .45); }
  dialog[open] { animation: rise .32s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .dlg { padding: 22px 22px 18px; }
  .dlg h2 { margin: 0 0 6px; font-size: 21px; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; }
  .dlg > p { margin: 0 0 14px; color: var(--muted); }
  .facts { margin: 0 0 16px; border-top: 1px solid var(--rule); }
  .facts div { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .facts dt { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; font-weight: 600; padding-top: 2px; }
  .facts dd { margin: 0; }
  .facts a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }
  /* the facts fold away once the download starts; one quiet link brings them back */
  .fold2 { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s var(--ease), opacity .3s var(--ease); }
  .fold2 > div { overflow: hidden; min-height: 0; }
  .dlg.run .fold2 { grid-template-rows: 0fr; opacity: 0; }
  .dlg.run.facts-open .fold2 { grid-template-rows: 1fr; opacity: 1; }
  .peek { display: none; padding: 0; border: 0; background: none; color: var(--muted); font-size: 14px;
          text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 4px; }
  .dlg.run .peek { display: inline-block; animation: show .4s .2s var(--ease) backwards; }
  @keyframes show { from { opacity: 0; transform: translateY(4px); } }
  /* the arrivals board: words flip when the step changes, numbers roll */
  .g-board { margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--board); color: var(--board-ink); }
  .g-flaps { display: flex; gap: 3px; }
  .g-flaps + .g-flaps { margin-top: 3px; }
  .g-cell { position: relative; flex: 0 0 auto; width: 1.36em; height: 1.8em; overflow: hidden; border-radius: 3px; background: var(--board-cell);
          font-size: 15px; font-weight: 700; line-height: 1.8em; text-align: center; }
  .g-cell::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--board); opacity: .7; }
  .g-cell b { display: block; font-weight: inherit; }
  .g-cell.f b { animation: g-flap .28s var(--ease) backwards; animation-delay: var(--d, 0ms); }
  @keyframes g-flap { from { transform: perspective(90px) rotateX(-80deg); opacity: .15; } }
  .g-cell.n b { transition: transform .35s var(--ease); }
  .g-cell.n b span { display: block; height: 1.8em; }
  .g-cell.n.lead { color: var(--board-dim); }
  .g-rail { position: relative; height: 3px; margin-top: 12px; border-radius: 2px; background: var(--board-cell); overflow: hidden; }
  .g-rail i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: var(--board-ink); transition: width .25s linear; }
  .g-rail.wait i { width: 28%; transition: none; animation: g-slide 1.1s ease-in-out infinite alternate; }
  @keyframes g-slide { from { left: 0; } to { left: 72%; } }
  .g-cap { min-height: 1.5em; margin: 10px 0 0 !important; color: var(--muted); font-size: 14px; }
  .g-ticks { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 13px; }
  .g-ticks li { display: inline-flex; gap: 5px; align-items: center; }
  .g-ticks li.new { animation: show .4s var(--ease) backwards; }
  .g-ticks svg { color: var(--ok); }
  .g-note { margin: 2px 0 0 !important; color: var(--muted); font-size: 13px; }
  @media (max-width: 380px) { .g-cell { font-size: 12.5px; } .g-board { padding: 10px; } }
  .dlg .act { justify-content: flex-start; }
  .dlg > p.err { color: var(--warn); margin: 10px 0 0; }
  .dlg .fine { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
  .by { margin: -4px 0 12px !important; color: var(--muted); font-size: 13px; }
  @media (max-width: 480px) { .facts div { grid-template-columns: 1fr; gap: 2px; } .gem-chip em { display: none; } }

  .empty { padding: 28px 0; }
  .empty p { margin: 0 0 14px; color: var(--muted); max-width: 52ch; }
  .rest { display: inline-flex; align-items: center; gap: 6px; margin: 16px 4px 0; padding: 0; border: 0; background: none; color: var(--muted);
          text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 4px; }
  footer { padding: 40px 0 48px; color: var(--muted); max-width: 70ch; }

  @media (min-width: 720px) {
    .lede { padding-top: 56px; }
    .head { grid-template-columns: 64px minmax(0, 1.3fr) 110px minmax(0, 1fr) 100px 18px; }
    .col { display: block; }
    .cols { display: grid; grid-template-columns: 64px minmax(0, 1.3fr) 110px minmax(0, 1fr) 100px 18px; gap: 14px;
            padding: 12px 4px 8px; color: var(--muted); border-bottom: 1px solid var(--rule);
            text-transform: uppercase; letter-spacing: .06em; font-size: 12px; font-weight: 600; }
    .who em { display: none; }
    .cols span:nth-child(5) { text-align: right; }
    .who .when { display: none; }
  }
  @media (max-width: 420px) {
    .cells { grid-template-columns: repeat(2, 1fr); }
    .cells div:nth-child(3) { border-left: 0; }
    .cells div:nth-child(n+3) { border-top: 1px solid var(--rule); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fold, .chev, .btn, .strip i { transition: none; }
    .reveal .flip, dialog[open], .g-cell.f b, .g-ticks li.new, .dlg.run .peek, .g-rail.wait i { animation: none; }
    .g-cell.n b, .g-rail i, .fold2 { transition: none; }
    .bar i { animation: none; width: 60%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>No-Show Desk</div>
    <div class="top-r"><span id="gem-slot"></span><span class="demo" id="day"></span></div>
  </header>
  <dialog id="gem" aria-labelledby="gem-title"></dialog>
  <section class="lede" id="lede" aria-live="polite"></section>
  <div id="main"></div>
  <footer>Demo motel built on real 2017 bookings from two Portuguese hotels (Antonio, Almeida &amp; Nunes, 2019, CC BY 4.0). Guest names and contacts are made up; prices are shown in dollars. Nothing is sent to anyone. <span id="again"></span></footer>
</div>

<script>
const svg = (d, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  chev: svg('<path d="m6 9 6 6 6-6"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>', 18),
  alert: svg('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>', 18),
  send: svg('<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>'),
  pen: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

function status(g) {

async function load() {

function advance() {   // after a decision, unfold the next guest who still needs one

async function act(id, action, opts = {}) {
  const body = action === "send" ? JSON.stringify({text: edits[id] ?? data.guests.find((g) => g.id === id).draft, anyway: !!opts.anyway})
    : action === "draft" && (opts.text || opts.by) ? JSON.stringify({text: opts.text, by: opts.by}) : undefined;
  busy[id] = action; delete errors[id]; render();
  try {
    const r = await fetch(`/api/guests/${encodeURIComponent(id)}/${action}`,
                          {method: "POST", headers: {"content-type": "application/json"}, body});
    if (r.ok) {
      const g = await r.json();
      data.guests = data.guests.map((x) => x.id === id ? g : x);
      delete needYes[id];
      if (g.outcome === "sent") delete edits[id];
    } else if (r.status === 422) {
      needYes[id] = (await r.json()).detail.problems;
    } else if (r.status === 409) { await load(); errors[id] = "Already decided on another screen. This is where it stands now."; }

  } catch { errors[id] = "Lost contact with the desk. Is it still running?"; }

const COLS = `<li class="cols" aria-hidden="true"><span>Risk</span><span>Guest</span><span>Arrives</span><span>Status</span><span>Total</span><span></span></li>`;

function bookingsList() {

  return data.guests.filter(match[ui.filter] || match.all).filter((g) => !q || g.booking.guest.toLowerCase().includes(q))

function renderBoard() {

    const common = sh.length && flagged().length ? `<p class="common"><b>What they all have in common:</b> ${sh.map((r) =>
      `${esc(r.label[0].toLowerCase() + r.label.slice(1))} (${pct(r.rate)} of ${esc(r.who)} cancelled, against ${pct(r.base)} of all bookings without a deposit)`).join("; ")}.</p>` : "";

// Gemma in the browser. The page downloads the model once from its public Hugging Face page, keeps it in this
// site's private browser storage (OPFS), and runs it on the graphics chip with LiteRT-LM. Every step the screen
// shows is a real event: bytes counted as they arrive, the exact size checked, the load timed.
const GEM = {
  page: "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm",
  url: "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it-web.litertlm",
  file: "gemma-4-E2B-it-web.litertlm", bytes: 2008432640,   // the published size, checked after download
  lib: "https://cdn.jsdelivr.net/npm/@litert-lm/core@0.18.0/+esm",
};
let gem = {step: "ask", got: 0, t0: 0, secs: 0, kept: null, error: "", engine: null, for: null, abort: null};
let gemQueue = Promise.resolve(), wrote = {};
const browserDrafts = () => data?.drafts === "browser";
const GB = (n) => (n / 1e9).toFixed(1) + " GB", MB = (n) => Math.round(n / 1e6).toLocaleString("en-US") + " MB";

async function savedModel() {   // the copy kept by an earlier visit, if it's whole
  try {
    const f = await (await (await navigator.storage.getDirectory()).getFileHandle(GEM.file)).getFile();
    gem.partial = f.size && f.size !== GEM.bytes ? f.size : 0;   // an unfinished download, replaced by the next one
    return f.size === GEM.bytes ? f : null;
  } catch { return null; }
}
async function bootGem() {   // a copy kept by an earlier visit loads by itself: the visitor already said yes to it once
  if (!browserDrafts() || PHONE || !navigator.gpu || gem.engine || gem.step !== "ask" || lastFail()) return;
  gem.saved = await savedModel();
  if (gem.saved) { gem.kept = true; startGem(); }
}
async function roomToKeep() {
  try { const {quota, usage} = await navigator.storage.estimate(); return quota - usage > GEM.bytes * 1.05; } catch { return false; }
}

// Phones and tablets: a 2 GB model needs more memory than their browsers give one page (an iPhone 15 Pro downloaded
// it, then Safari closed the tab while loading it). They get the recorded message instead, with no download offered.
const PHONE = !!navigator.userAgentData?.mobile || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);   // iPads say "Macintosh"
// A load that never finished: the browser killed the tab (out of memory) before any error could be caught.
try {
  const was = localStorage.getItem("gem-loading");
  if (was) {
    localStorage.setItem("gem-failed", `the page closed while ${was}, most likely out of memory`);
    localStorage.removeItem("gem-loading");
  }
} catch {}
const loading = (doing) => { try { doing ? localStorage.setItem("gem-loading", doing) : localStorage.removeItem("gem-loading"); } catch {} };
addEventListener("pagehide", () => loading(""));   // a close or reload by the visitor; a tab killed for memory never gets here

async function canRun() {   // what can be known before a 2 GB download: the device, a WebGPU adapter, the last try
  if (PHONE) return "Phones and tablets don't give one web page enough memory for Gemma";
  if (navigator.deviceMemory && navigator.deviceMemory <= 4) return "This device has too little memory for Gemma";
  if (!navigator.gpu) return "This browser has no WebGPU";
  try { if (!(await navigator.gpu.requestAdapter())) return "This browser has WebGPU but no graphics adapter for it"; }
  catch { return "This browser's WebGPU didn't answer"; }
  return "";
}
const lastFail = () => { try { return localStorage.getItem("gem-failed") || ""; } catch { return ""; } };
const markFail = (why) => { try { why ? localStorage.setItem("gem-failed", why) : localStorage.removeItem("gem-failed"); } catch {} };

async function openGem(forId = null) {
  gem.for = forId ?? gem.for;
  const idle = () => ["ask", "failed", "nogpu"].includes(gem.step);
  if (idle()) {
    const cant = await canRun(), saved = await savedModel(), kept = saved ? true : await roomToKeep();
    if (idle()) {   // a quiet load may have started while the checks ran; never overwrite it
      gem.cant = cant;
      gem.step = cant ? "nogpu" : gem.step === "failed" ? "failed" : "ask";
      gem.leftover = cant || lastFail() ? (saved ? GEM.bytes : gem.partial) : 0;   // a copy this device can't use: offer to free it
      gem.saved = cant ? null : saved;
      gem.kept = kept;
    }
  }
  paintGem();
  if (!$("#gem").open) { $("#gem").showModal(); $("#gem-act .btn")?.focus(); }   // the main action, not the first link
}

async function startGem() {
  const ctl = new AbortController();
  gem.abort = ctl; gem.error = ""; gem.got = 0; gem.streaming = false;
  let fetched = false;
  try {
    let model = gem.saved;
    if (!model) {
      gem.step = "download"; gem.t0 = performance.now(); paintGem();
      const res = await fetch(GEM.url, {signal: ctl.signal});
      if (!res.ok) throw new Error(`the download was refused (${res.status})`);
      const size = +res.headers.get("content-length");
      if (size !== GEM.bytes) throw new Error(`the server offers ${size.toLocaleString("en-US")} bytes, not the published ${GEM.bytes.toLocaleString("en-US")}`);

        if (model.size !== GEM.bytes) throw new Error(`got ${model.size.toLocaleString("en-US")} bytes, expected ${GEM.bytes.toLocaleString("en-US")}`);
        fetched = true;

let ticking = false;

function paintMeter() {   // in place, many times a second: digits roll, the rail grows, the caption counts

let loadTimer = 0;

async function forgetGem() {

// The board: 11 cells a row. Letters flip only when the word changes; numbers roll, so nothing restarts per frame.
const W = 11;
const flapCells = (text, from = 0) => [...text].map((c, i) =>
  `<span class="g-cell f" style="--d:${(from + i) * 26}ms"><b>${c === " " ? "&nbsp;" : esc(c)}</b></span>`).join("");
const numCells = (n) => `<span id="gem-num" style="display:contents">${Array.from({length: n}, () =>
  `<span class="g-cell n"><b>${[...Array(10).keys()].map((d) => `<span>${d}</span>`).join("")}</b></span>`).join("")}</span>`;

  const cells = el.querySelectorAll(".g-cell"), digits = String(Math.min(value, 10 ** cells.length - 1)).padStart(cells.length, "0");
  cells.forEach((c, i) => {
    c.querySelector("b").style.transform = `translateY(-${digits[i] * 1.8}em)`;
    c.classList.toggle("lead", i < cells.length - 1 && /^0+$/.test(digits.slice(0, i + 1)));   // leading zeros dim
  });
}
function board(s) {
  const pad = (used) => flapCells(" ".repeat(Math.max(0, W - used)), used);
  const top = {download: "DOWNLOADING", check: "CHECKING", load: "LOADING", ready: "READY", failed: "STOPPED"}[s];
  const second = s === "download" ? numCells(4) + flapCells(" MB", 4) + pad(7)
    : s === "check" ? flapCells("SIZE OK") + pad(7)
    : s === "load" ? numCells(3) + flapCells(" S", 3) + pad(5)
    : pad(0);
  const done = [!gem.saved && ["download", "check", "load", "ready"].indexOf(s) > 0 && "Downloaded 2.0 GB",
                gem.kept && !gem.saved && ["load", "ready"].includes(s) && "Size matches",
                gem.saved && "Found on this device",
                s === "ready" && "On the graphics chip"].filter(Boolean);
  const cap = s === "check" ? `${GEM.bytes.toLocaleString("en-US")} bytes, exactly the published size.`
    : s === "ready" ? (gem.streaming ? "Each message takes a few seconds. This browser had no room to keep it, so the next visit downloads it again." : "Each message takes a few seconds.")
    : s === "failed" ? "" : "Starting…";
  return `<div class="g-board" role="img" aria-label="${top.toLowerCase()}">
      <div class="g-flaps">${flapCells(top) + pad(top.length)}</div><div class="g-flaps">${second}</div>
      <div class="g-rail ${s === "load" ? "wait" : ""}"><i id="gem-rail" style="width:${s === "check" || s === "ready" ? 100 : 0}%"></i></div></div>
    <p class="g-cap" id="gem-cap">${cap}</p>
    ${s === "load" ? `<p class="g-note">The browser may stop responding for a while during or just after this. It did on our 8 GB test Mac, then carried on.</p>` : ""}
    ${done.length ? `<ul class="g-ticks">${done.map((t, i) => `<li class="${i === done.length - 1 ? "new" : ""}">${svg('<path d="M20 6 9 17l-5-5"/>', 13)}${t}</li>`).join("")}</ul>` : ""}`;
}

function toggleFacts(btn) {

function renderGemChip() {
  const slot = $("#gem-slot");
  if (!slot) return;
  const word = PHONE ? "recorded messages" : gem.engine ? "ready" : gem.step === "load" ? "loading" : gem.step === "download" || gem.step === "check" ? "downloading" : "not loaded";
  slot.innerHTML = browserDrafts() ? `<button class="gem-chip ${gem.engine ? "on" : ""}" onclick="openGem()" aria-label="Gemma: ${word}">
    <i aria-hidden="true"></i><span>Gemma<em>: ${word}</em></span></button>` : "";
}

function draftHere(id) {   // one model job at a time; the page stays usable meanwhile

  if (!gem.engine) return openGem(id);
  busy[id] = "draft"; delete errors[id]; render();
  gemQueue = gemQueue.then(async () => {
    try {
      const b = await (await fetch(`/api/guests/${encodeURIComponent(id)}/brief`)).json();
      const chat = await gem.engine.createConversation({preface: {messages: [{role: "system", content: b.system}]},
        sessionConfig: {samplerParams: {type: 2, temperature: 0.7, p: 0.95, k: 64, seed: 1}}});   // Ollama's Gemma defaults

}
function dropGem() { if (gem.step === "download") gem.abort?.abort(); gem.for = null; }   // stop a download, forget the waiting guest

// Replay: the stored test mornings. Scores were made before each morning; outcomes stay hidden until Reveal.
let replays = {}, rp = {year: "2017", i: null, line: null, seen: {}, all: false};
const money = (n) => "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const rpYear = () => replays[rp.year];
const rpKey = () => `${rp.year}-${rp.i}`;

async function getYear(y) {
  if (!replays[y]) {
    const r = await fetch(`/api/replay/${y}`);
    if (!r.ok) throw new Error(r.status);
    replays[y] = await r.json();

}
function settle() {   // first visit to a year: the demo morning if the year has it, else its first morning
  rp.line ??= rpYear().line;

}

function tally(m, line = rp.line) {   // one morning at one line: who'd be messaged, and who really cancelled
  const msgd = m.guests.filter((g) => g.risk >= line), cancelled = m.guests.filter((g) => g.cancelled);
  const caught = msgd.filter((g) => g.cancelled);
  return {msgs: msgd.length, cancelled: cancelled.length, caught: caught.length, missed: cancelled.filter((g) => g.risk < line),
          random: msgd.length * cancelled.length / m.guests.length,   // the same number of messages, sent at random
          value: caught.reduce((s, g) => s + g.total, 0)};
}
function yearTally() {
  const ts = rpYear().mornings.map((m) => tally(m));

  return {mornings: ts.length, msgs: add("msgs"), cancelled: add("cancelled"), caught: add("caught"), random: add("random"), value: add("value")};

function rpState(g, shown) {   // before Reveal: what the desk said that morning. After: what the guest did
  const lit = g.risk >= rp.line;
  if (!shown) return {lit, st: lit ? "Might not show" : "Expected", tone: lit ? "st-risk" : ""};
  if (g.cancelled) return {lit, st: lit ? "Cancelled, caught" : "Cancelled, missed", tone: lit ? "st-caught" : "st-missed"};
  return {lit, st: lit ? "Came anyway" : "Came", tone: ""};
}

      <span class="col">${esc(day(g.arrival))}<span>${nights}</span></span>

function rpPaint() {   // in place, so lamps fade on and off while the line is dragged

function replayBoard() {
  if (!rpYear()) return "";
  const m = rpYear().mornings[rp.i], shown = !!rp.seen[rpKey()];
  const next = rp.i < rpYear().mornings.length - 1 ? `<button class="btn quiet" onclick="goMorning(${rp.i + 1})">Next morning ${ICON.right}</button>` : "";
  return `<div class="act rp-act">${shown ? next : `<button class="btn" onclick="reveal()">Reveal what happened</button>`}
      ${rp.all ? "" : `<button class="btn quiet" onclick="runAll()">Replay all ${rpYear().mornings.length} mornings</button>`}</div>
    ${rp.all ? `<div class="sum"><div id="rp-sum">${summary()}</div>${strip()}</div>` : ""}
    <ul class="board" id="rp-board">${COLS.replace("Status", shown ? "What happened" : "Status")}${m.guests.slice().sort((a, b) => b.risk - a.risk)
      .map((g, i) => rpRow(g, i, shown)).join("")}</ul>`;
}

function reveal() {
  rp.seen[rpKey()] = true;
  $("#lede").innerHTML = replayLede();
  renderBoard();
  $("#rp-board").classList.add("reveal");   // the status words flip over, riskiest first
}
function goMorning(i) { rp.i = Math.max(0, Math.min(i, rpYear().mornings.length - 1)); render(); }
function setLine(v) { rp.line = v / 100; $("#line-out").textContent = v + "%"; $("#line-reset").hidden = v === Math.round(rpYear().line * 100); rpPaint(); }
function setYear(y) { rp.year = y; rp.i = null; rp.all = false; if (rpYear()) settle(); render(); }
function runAll() {
  rp.all = "intro"; renderBoard();
  const big = $("#rp-sum [data-n]"), to = +big.dataset.n, t0 = performance.now();
  if (!calm()) requestAnimationFrame(function up(t) {   // count up while the bars rise, morning by morning
    const k = Math.min(1, (t - t0) / 1600);
    big.textContent = Math.round(to * (1 - (1 - k) ** 3));
    if (k < 1) requestAnimationFrame(up);
  });
  setTimeout(() => { rp.all = true; $(".strip")?.classList.remove("intro"); }, 1800);
}

async function startOver() { await fetch("/api/reset", {method: "POST"}); try { sessionStorage.clear(); } catch {} location.reload(); }

function render() {
  renderGemChip();
  $("#again").innerHTML = data.hosted ? `<button class="rest" style="margin:0" onclick="startOver()">Start this demo morning over</button>` : "";
  $("#day").innerHTML = esc(day(data.day, {weekday: "short", day: "numeric", month: "short", year: "numeric"})) + SEP + "demo day";
  if (!data.guests.length) {
    $("#lede").innerHTML = `<h1>Good morning.</h1><p>Check the guests arriving in the next ${data.days_ahead} days. It takes a few seconds.</p>`;
    $("#main").innerHTML = `<div class="empty"><button class="btn" onclick="runMorning(this)">Check this morning's guests</button><p class="err" id="morning-err"></p></div>`;
    return;
  }
  if (ui.tab === "replay" && !rpYear()) getYear(rp.year).then(render).catch(() => { $("#lede").innerHTML = `<h1>Can't load the past mornings.</h1><p>Reload to try again.</p>`; });
  $("#lede").innerHTML = ui.tab === "replay" ? replayLede() : lede();
  const t = (id, label, n) => `<button role="tab" aria-selected="${ui.tab === id}" onclick="tab('${id}')">${label}${n === "" ? "" : `<span class="n">${n}</span>`}</button>`;
  const c = (id, label) => `<button aria-pressed="${ui.filter === id}" onclick="filter('${id}')">${label}</button>`;
  const tools = ui.tab === "bookings" ? `<div class="tools">
      <label class="find">${ICON.search}<input type="search" placeholder="Find a guest" aria-label="Find a guest" value="${esc(ui.query)}" oninput="search(this.value)"></label>
      <div class="chips" role="group" aria-label="Show">${c("all", "All")}${c("risk", "Might not show")}${c("decided", "Decided")}${c("later", "Later")}</div></div>`
    : ui.tab === "replay" && rpYear() ? replayTools() : "";
  $("#main").innerHTML = `<div class="switch" role="tablist">${t("today", "Today", flagged().length)}${t("bookings", "Bookings", data.guests.length)}${t("replay", "Replay", "")}</div>
    ${tools}<div id="board-slot"></div>`;
  renderBoard();
}

load().catch(() => { $("#lede").innerHTML = `<h1>Can't reach the desk.</h1><p>Start it with .venv/bin/python -m noshow.app, then reload.</p>`; });
</script>
</body>
</html>
